<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>داشبورد</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><h1>داشبورد</h1><p>{{user.email}}</p><section class="card"><h2>پرونده جدید</h2><form method="post" action="/cases"><input name="title" placeholder="عنوان پرونده" required><select name="expires_days"><option value="1">۱ روز</option><option value="7" selected>۷ روز</option><option value="30">۳۰ روز</option></select><button class="btn">ساخت لینک</button></form></section>{% for c in cases %}<section class="card"><b>{{c.title}}</b><p>وضعیت: {{c.status}} | انقضا: {{c.expires_at}}</p><a href="/case/{{c.id}}">مشاهده</a></section>{% else %}<p>هنوز پرونده‌ای ندارید.</p>{% endfor %}</main></body></html>

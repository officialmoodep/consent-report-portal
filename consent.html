<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>صفحه رضایت</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card"><h1>تأیید و اشتراک‌گذاری اطلاعات</h1><p>این صفحه متعلق به یک پرونده با عنوان «{{case.title}}» است. هیچ اطلاعات حساسی بدون انتخاب و اجازه شما ارسال نمی‌شود.</p><form id="consentForm" method="post" enctype="multipart/form-data"><label><input type="checkbox" id="loc" name="consent_location" value="yes"> اجازه اشتراک‌گذاری موقعیت مکانی</label><input type="hidden" name="latitude" id="lat"><input type="hidden" name="longitude" id="lon"><label><input type="checkbox" name="consent_phone" value="yes"> اجازه اشتراک‌گذاری شماره تلفن</label><input name="phone" type="tel" placeholder="شماره تلفن (اختیاری)"><label><input type="checkbox" id="photoConsent" name="consent_photo" value="yes"> اجازه اشتراک‌گذاری عکس</label><input name="photo" id="photo" type="file" accept="image/*" capture="user"><button class="btn" type="submit">ارسال اطلاعات انتخاب‌شده</button></form><small>لینک تا {{case.expires_at}} معتبر است.</small></main><script src="/static/consent.js"></script></body></html>
